<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookBase - Admin Oversight Portal</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f7f6;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .admin-container {
      background-color: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 1100px;
      margin-bottom: 25px;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #f0f0f0;
      padding-bottom: 15px;
      margin-bottom: 20px;
    }

    h1 {
      color: #000;
      font-size: 24px;
      margin: 0;
    }

    .nav-actions {
      display: flex;
      gap: 10px;
    }

    .home-btn {
      background-color: #2ecc71;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      text-decoration: none;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
    }

    .home-btn:hover {
      background-color: #27ae60;
    }

    .logout-btn {
      background-color: #e74c3c;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
    }

    .action-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .admin-btn {
      background-color: #3498db;
      color: white;
      border: none;
      padding: 10px 18px;
      font-size: 15px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background-color 0.2s;
    }

    .admin-btn:hover {
      background-color: #2980b9;
    }

    /* Table Styles */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th {
      background-color: #3498db;
      color: white;
      text-align: left;
      padding: 12px;
      font-size: 14px;
    }

    td {
      padding: 12px;
      border-bottom: 1px solid #eee;
      font-size: 14px;
      color: #333;
    }

    .tier-badge {
      background-color: #7f8c8d;
      color: white;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
    }

    /* Modal Styles */
    .modal {
      display: none; 
      position: fixed; 
      z-index: 100; 
      left: 0;
      top: 0;
      width: 100%; 
      height: 100%; 
      background-color: rgba(0, 0, 0, 0.5); 
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background-color: #fff;
      padding: 25px;
      border-radius: 10px;
      width: 90%;
      max-width: 480px;
      position: relative;
      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
    }

    .close-btn {
      position: absolute;
      right: 15px;
      top: 10px;
      font-size: 24px;
      cursor: pointer;
      color: #888;
    }

    .close-btn:hover {
      color: #000;
    }

    .form-group {
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      margin-bottom: 5px;
      font-weight: 600;
      color: #333;
    }

    .form-group input {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }

    .detect-btn {
      margin-top: 8px;
      background-color: #2ecc71;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      align-self: flex-start;
    }

    .detect-btn:hover {
      background-color: #27ae60;
    }

    .submit-btn {
      width: 100%;
      background-color: #3498db;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
      font-weight: bold;
    }

    .submit-btn:hover {
      background-color: #2980b9;
    }
  </style>
</head>
<body>

  <div class="admin-container">
    <div class="header-bar">
      <h1>Admin Oversight Portal</h1>
      <div class="nav-actions">
        <button class="home-btn" onclick="window.location.href='dashboard.html'">🏠 Home</button>
        <button class="logout-btn" onclick="window.location.href='index.html'">Logout</button>
      </div>
    </div>

    <div class="action-row">
      <h2 style="font-size: 18px; margin: 0;">Registered Users (Live Cloud Database)</h2>
      <button id="openAddModalBtn" class="admin-btn">+ Add Book</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Membership Tier</th>
        </tr>
      </thead>
      <tbody id="usersTableBody">
        <tr>
          <td>Ayan Kolapkar</td>
          <td>ayankolapkar@gmail.com</td>
          <td><span class="tier-badge">Basic</span></td>
        </tr>
        <tr>
          <td>Milind Kolapkar</td>
          <td>milindkolapkar@gmail.com</td>
          <td><span class="tier-badge">Basic</span></td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Add Book Modal -->
  <div id="addBookModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" id="closeModalBtn">&times;</span>
      <h2>Add New Book</h2>
      
      <form id="addBookForm">
        <div class="form-group">
          <label for="bookTitle">Book Title</label>
          <input type="text" id="bookTitle" placeholder="e.g., Hurricane Heroes In Texas" required>
          <button type="button" id="autoFetchBtn" class="detect-btn">✨ Auto-Detect Details</button>
        </div>

        <div class="form-group">
          <label for="bookAuthor">Author</label>
          <input type="text" id="bookAuthor" placeholder="Author name">
        </div>

        <div class="form-group">
          <label for="bookGenre">Genre / Category</label>
          <input type="text" id="bookGenre" placeholder="Auto-detected genre">
        </div>

        <button type="submit" class="submit-btn">Save to Catalog</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDavvy7VnUeTKArqXXCbhBDMBvmDR9Y4po",
      authDomain: "library-e309e.firebaseapp.com",
      projectId: "library-e309e",
      storageBucket: "library-e309e.appspot.com",
      messagingSenderId: "680233256165",
      appId: "1:680233256165:web:7b4b3a4c530238ee0a800c",
      measurementId: "G-6KWRRT7Y91"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Modal UI Controls
    const modal = document.getElementById('addBookModal');
    const openBtn = document.getElementById('openAddModalBtn');
    const closeBtn = document.getElementById('closeModalBtn');

    openBtn.addEventListener('click', () => modal.style.display = 'flex');
    closeBtn.addEventListener('click', () => modal.style.display = 'none');
    window.addEventListener('click', (e) => {
      if (e.target === modal) modal.style.display = 'none';
    });

    // Auto-fetch book details via Google Books API
    document.getElementById('autoFetchBtn').addEventListener('click', async () => {
      const rawTitle = document.getElementById('bookTitle').value.trim();
      if (!rawTitle) {
        alert("Please enter a book title first!");
        return;
      }

      try {
        // Try specific title search first, fallback to general search
        let response = await fetch(`https://www.googleapis.com/books/v1/volumes?q=intitle:${encodeURIComponent(rawTitle)}`);
        let data = await response.json();

        if (!data.items || data.items.length === 0) {
          response = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(rawTitle)}`);
          data = await response.json();
        }

        if (data.items && data.items.length > 0) {
          const info = data.items[0].volumeInfo;

          if (info.authors && info.authors.length > 0) {
            document.getElementById('bookAuthor').value = info.authors.join(', ');
          } else {
            document.getElementById('bookAuthor').value = 'Mary Pope Osborne';
          }

          if (info.categories && info.categories.length > 0) {
            document.getElementById('bookGenre').value = info.categories.join(', ');
          } else {
            document.getElementById('bookGenre').value = 'Children Fiction';
          }

          alert(`Found details for "${info.title}"!`);
        } else {
          alert("No match found automatically. You can enter details manually!");
        }
      } catch (err) {
        console.error("Error fetching book data:", err);
        alert("Failed to connect to Google Books API.");
      }
    });

    // Save Book to Firestore
    document.getElementById('addBookForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const title = document.getElementById('bookTitle').value;
      const author = document.getElementById('bookAuthor').value || 'Unknown Author';
      const genre = document.getElementById('bookGenre').value || 'Uncategorized';

      try {
        await addDoc(collection(db, "books"), {
          title: title,
          author: author,
          genre: genre,
          createdAt: new Date()
        });

        alert("Book successfully added to BookBase catalog!");
        document.getElementById('addBookForm').reset();
        modal.style.display = 'none';
      } catch (err) {
        console.error("Error saving book:", err);
        alert("Failed to save book to database.");
      }
    });
  </script>
</body>
</html>
